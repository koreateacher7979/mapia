<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가치있는 미래교육 연구소 - 보이스 마피아</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // --- 설정 및 전역 변수 ---
        const apiKey = ""; 

        const PHASES = {
            LOBBY: '대기실',
            NIGHT: '밤',
            MORNING: '사건 브리핑',
            DISCUSSION: '자유 토론',
            VOTING: '투표 진행',
            TRIAL: '최후 변론',
            GAME_OVER: '게임 종료'
        };

        const ROLES = {
            MAFIA: '마피아',
            POLICE: '경찰',
            DOCTOR: '의사',
            CITIZEN: '시민'
        };

        // --- 상태 관리 ---
        let players = [];
        let phase = PHASES.LOBBY;
        let logs = [];
        let myId = 0;
        let isMuted = false;
        let nomineeId = null;
        let currentSubtitles = ""; 
        let chatInputBuffer = ""; 
        
        let speechQueue = [];
        let isProcessingQueue = false;

        const AI_NAMES = ["강호동", "유재석", "신동엽", "이경규", "김구라", "박명수", "하하"];

        // --- TTS 및 동기화 로직 ---
        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.length);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length, true);
            const pcmView = new Uint8Array(pcmData);
            for (let i = 0; i < pcmData.length; i++) view.setUint8(44 + i, pcmView[i]);
            return new Blob([view], { type: 'audio/wav' });
        };

        const processQueue = async () => {
            if (isProcessingQueue || speechQueue.length === 0) return;
            isProcessingQueue = true;

            const { text, isChat, speakerName, speakerId, callback } = speechQueue.shift();
            
            try {
                const promptPrefix = isChat ? "한국어로 연극 대사처럼 감정을 담아 아주 자연스럽게 말해주세요: " : "마피아 게임 사회자로서 신뢰감 있게 한국어로 말해주세요: ";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptPrefix + text }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const responseText = await response.text();
                if (!responseText) throw new Error("Empty response body");
                
                const result = JSON.parse(responseText);
                const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                
                if (base64Audio) {
                    const pcmData = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
                    const wavBlob = pcmToWav(pcmData, 24000);
                    const audio = new Audio(URL.createObjectURL(wavBlob));
                    
                    await new Promise(resolve => {
                        audio.oncanplaythrough = resolve;
                        audio.onerror = resolve;
                    });

                    // [동기화] 음성이 재생될 때만 텍스트와 로그를 업데이트하여 중복 방지
                    const displayMsg = speakerName ? `${speakerName}: "${text}"` : text;
                    currentSubtitles = displayMsg;
                    logs.push(displayMsg);
                    if (logs.length > 50) logs.shift();

                    if (speakerId !== undefined && players[speakerId]) {
                        players[speakerId].isSpeaking = true;
                    }
                    
                    if (callback) callback();
                    updateUI();

                    await new Promise((resolve) => {
                        audio.onended = resolve;
                        audio.onerror = resolve; 
                        audio.play().catch(resolve);
                    });
                } else {
                    throw new Error("No audio data in response");
                }
            } catch (err) { 
                console.error("TTS 에러 처리:", err);
                // 음성 재생 실패 시에도 텍스트는 보여주고 다음으로 진행
                const displayMsg = speakerName ? `${speakerName}: "${text}" (음성 오류)` : text;
                logs.push(displayMsg);
                if (callback) callback();
                updateUI();
                await new Promise(r => setTimeout(r, 2000));
            } finally {
                currentSubtitles = "";
                if (speakerId !== undefined && players[speakerId]) {
                    players[speakerId].isSpeaking = false;
                }
                updateUI();
                isProcessingQueue = false;
                setTimeout(processQueue, 300);
            }
        };

        const speakText = (text, isChat = false, speakerName = "", speakerId = undefined, callback = null) => {
            if (isMuted || !text) return;
            // 중복 멘트 요청 방지
            if (speechQueue.some(q => q.text === text)) return;
            speechQueue.push({ text, isChat, speakerName, speakerId, callback });
            processQueue();
        };

        // --- UI Rendering ---
        const updateUI = () => {
            const root = document.getElementById('game-root');
            const activeElId = document.activeElement ? document.activeElement.id : null;
            const selectionStart = document.activeElement ? document.activeElement.selectionStart : null;

            if (phase === PHASES.LOBBY) renderLobby();
            else renderGame();
            
            lucide.createIcons();

            if (activeElId) {
                const el = document.getElementById(activeElId);
                if (el) {
                    el.focus();
                    if (selectionStart !== null) el.setSelectionRange(selectionStart, selectionStart);
                }
            }
        };

        const renderLobby = () => {
            const root = document.getElementById('game-root');
            root.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 p-8 rounded-[40px] border border-slate-800 shadow-2xl animate-in fade-in duration-500">
                    <div class="flex flex-col items-center gap-4 mb-8">
                        <div class="p-5 bg-red-600/20 rounded-full border border-red-600/30">
                            <i data-lucide="mic" class="text-red-500 w-10 h-10"></i>
                        </div>
                        <h2 class="text-3xl font-black tracking-tighter">VOICE MAFIA</h2>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase tracking-widest">당신의 닉네임</label>
                            <input type="text" id="player-nickname" placeholder="이름을 입력하세요" class="w-full bg-slate-950 border border-slate-800 p-5 rounded-3xl focus:ring-2 focus:ring-red-500/50 outline-none transition-all text-center font-bold text-white">
                        </div>
                        <button onclick="startGame()" class="w-full py-5 bg-red-600 hover:bg-red-500 rounded-3xl font-black transition-all shadow-lg shadow-red-900/30 text-lg">
                            게임 시작하기
                        </button>
                    </div>
                </div>
            `;
        };

        const renderGame = () => {
            const root = document.getElementById('game-root');
            const me = players[myId];
            
            root.innerHTML = `
                <div class="grid md:grid-cols-12 gap-6 animate-in zoom-in-95 duration-300">
                    <div class="md:col-span-8 space-y-6">
                        <div class="h-24 flex items-center justify-center">
                            ${currentSubtitles ? `
                                <div class="bg-black/90 border border-indigo-500/30 p-5 rounded-2xl text-white text-sm font-bold shadow-2xl flex items-center gap-4 max-w-xl text-center leading-relaxed animate-in fade-in slide-in-from-top-2">
                                    <div class="flex-shrink-0 w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
                                    <span>${currentSubtitles}</span>
                                </div>
                            ` : ''}
                        </div>

                        <div class="bg-slate-900/50 border border-slate-800 rounded-[50px] p-10 relative min-h-[420px] flex items-center justify-center shadow-inner">
                            <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
                                <i data-lucide="circle" class="w-[300px] h-[300px] text-slate-400"></i>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-x-16 gap-y-20 relative z-10 w-full">
                                ${players.map((p, idx) => `
                                    <div class="flex flex-col items-center gap-3">
                                        <div class="relative">
                                            <div class="w-20 h-20 rounded-full flex items-center justify-center text-xl font-black transition-all duration-300 ${
                                                !p.isAlive ? 'bg-slate-950 text-slate-700 border border-slate-900 opacity-40 grayscale' : 
                                                idx === myId ? 'bg-red-600 text-white ring-4 ring-red-500/30 scale-110 shadow-xl' : 
                                                'bg-slate-800 text-slate-300 border-2 border-slate-700'
                                            } ${p.isSpeaking ? 'ring-4 ring-blue-500 shadow-blue-500/50 scale-110 z-20' : ''}">
                                                ${p.name[0]}
                                            </div>
                                            ${idx === myId ? '<div class="absolute -top-2 -right-2 bg-red-500 text-[9px] font-black px-2 py-0.5 rounded-full text-white shadow-md">나</div>' : ''}
                                            ${p.isSpeaking ? '<div class="absolute -bottom-2 -right-2 bg-blue-500 p-2 rounded-full animate-bounce shadow-md border-2 border-slate-900"><i data-lucide="mic" class="w-3 h-3 text-white"></i></div>' : ''}
                                            ${p.vote !== null && phase === PHASES.VOTING ? `<div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-amber-500 text-[10px] text-black font-black px-3 py-1 rounded-lg shadow-lg animate-in zoom-in">지목!</div>` : ''}
                                        </div>
                                        <div class="flex flex-col items-center">
                                            <span class="text-sm font-black ${!p.isAlive ? 'text-slate-600 line-through' : 'text-slate-200'}">${p.name}</span>
                                            ${p.role && (idx === myId || !p.isAlive || phase === PHASES.GAME_OVER) ? `<span class="text-[9px] text-red-500 font-bold tracking-widest mt-1">${p.role}</span>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                            <div class="p-4 bg-slate-800/50 border-b border-slate-700 flex justify-between items-center">
                                <span class="text-[11px] font-bold text-slate-400 tracking-widest uppercase">작전 콘트롤 센터</span>
                                <span class="text-[10px] font-black text-indigo-400 px-3 py-1 bg-indigo-400/10 rounded-full border border-indigo-400/20">${phase}</span>
                            </div>
                            <div class="p-8">
                                ${renderActionContent()}
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-4 space-y-6">
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 h-[640px] flex flex-col shadow-2xl">
                            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                                <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> 타임라인</span>
                                <button onclick="setIsMuted(!isMuted)" class="p-2 rounded-xl hover:bg-slate-800 transition-all">
                                    <i data-lucide="${isMuted ? 'volume-x' : 'volume-2'}" class="w-4 h-4 ${isMuted ? 'text-red-500' : 'text-emerald-500'}"></i>
                                </button>
                            </div>
                            <div id="log-container" class="flex-1 overflow-y-auto space-y-4 pr-2 scrollbar-thin">
                                ${logs.map(log => `
                                    <div class="p-4 rounded-2xl border border-slate-800 bg-slate-950/60 animate-in slide-in-from-right-2 duration-300">
                                        <p class="text-[12px] leading-relaxed text-slate-300 font-medium">${log}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            const logContainer = document.getElementById('log-container');
            if(logContainer) logContainer.scrollTop = logContainer.scrollHeight;
        };

        const setIsMuted = (val) => { isMuted = val; updateUI(); };

        const renderActionContent = () => {
            const me = players[myId];
            if (!me.isAlive) return `<div class="text-center py-6 opacity-40 text-slate-500 italic">당신은 사망했습니다... 유령 모드로 지켜보세요.</div>`;

            if (phase === PHASES.NIGHT) {
                if (me.role === ROLES.CITIZEN) return `<div class="text-center py-6 italic text-indigo-400 animate-pulse text-sm font-bold">밤이 되었습니다. 마피아가 활동 중입니다...</div>`;
                return `
                    <p class="text-[11px] text-slate-500 mb-5 uppercase font-bold tracking-widest text-center">${me.role} 활동 대상 지목</p>
                    <div class="grid grid-cols-2 gap-4">
                        ${players.map((p, idx) => (p.isAlive && idx !== myId) ? `
                            <button onclick="handleAction(${idx})" class="py-4 rounded-2xl border border-slate-700 bg-slate-800 hover:border-indigo-500 hover:bg-indigo-500/10 transition-all text-xs font-black text-white">
                                ${p.name}
                            </button>
                        ` : '').join('')}
                    </div>
                `;
            }

            if (phase === PHASES.DISCUSSION) {
                return `
                    <div class="space-y-6">
                        <div class="flex gap-3">
                            <input type="text" id="chat-input" 
                                value="${chatInputBuffer}"
                                oninput="chatInputBuffer = this.value"
                                placeholder="의심스러운 사람의 이름을 부르며 대화하세요..." 
                                class="flex-1 bg-slate-950 border border-slate-800 p-5 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-bold text-white shadow-inner"
                                onkeypress="if(event.keyCode==13) sendMessage()">
                            <button onclick="sendMessage()" class="w-16 bg-red-600 hover:bg-red-500 rounded-2xl transition-all shadow-xl flex items-center justify-center text-white">
                                <i data-lucide="send" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <div class="flex justify-center border-t border-slate-800 pt-6">
                            <button onclick="goToVoting()" class="w-full py-5 bg-amber-600 hover:bg-amber-500 rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-amber-900/30 transition-all text-white">
                                토론 종료 및 투표 시작
                            </button>
                        </div>
                    </div>
                `;
            }

            if (phase === PHASES.VOTING) {
                return `
                    <p class="text-[11px] text-slate-500 mb-5 uppercase font-bold text-center tracking-widest">처형대에 세울 용의자를 선택하세요.</p>
                    <div class="grid grid-cols-2 gap-4">
                        ${players.map((p, idx) => p.isAlive ? `
                            <button onclick="handleVote(${idx})" class="py-4 rounded-2xl border border-slate-700 bg-slate-800 hover:border-amber-500 transition-all text-xs font-black text-white ${me.vote === idx ? 'ring-2 ring-amber-500 bg-amber-500/10' : ''}">
                                ${p.name}
                            </button>
                        ` : '').join('')}
                    </div>
                `;
            }

            if (phase === PHASES.TRIAL) {
                return `
                    <div class="flex gap-4">
                        <button onclick="handleJudgement(true)" class="flex-1 py-5 bg-red-600 hover:bg-red-500 rounded-2xl font-black shadow-xl text-lg text-white">유죄 (처형)</button>
                        <button onclick="handleJudgement(false)" class="flex-1 py-5 bg-slate-700 hover:bg-slate-600 rounded-2xl font-black text-lg text-white">무죄 (방면)</button>
                    </div>
                `;
            }

            return `<div class="text-center py-6 text-slate-600 italic text-sm animate-pulse tracking-tighter">사회자가 상황을 정리하고 있습니다...</div>`;
        };

        // --- 게임 로직 ---
        const startGame = () => {
            const nickname = document.getElementById('player-nickname').value.trim() || "플레이어";
            players = [{ name: nickname, role: null, isAlive: true, vote: null, target: null, isSpeaking: false }];
            
            const selectedAI = [...AI_NAMES].sort(() => Math.random() - 0.5).slice(0, 5);
            selectedAI.forEach(name => {
                players.push({ name: name, role: null, isAlive: true, vote: null, target: null, isSpeaking: false });
            });

            const roles = [ROLES.MAFIA, ROLES.POLICE, ROLES.DOCTOR, ROLES.CITIZEN, ROLES.CITIZEN, ROLES.CITIZEN];
            const shuffledRoles = roles.sort(() => Math.random() - 0.5);
            players.forEach((p, i) => p.role = shuffledRoles[i]);

            phase = PHASES.NIGHT;
            speakText(`마피아 게임이 시작되었습니다. 당신의 정체는 ${players[myId].role}입니다. 이제 밤이 되었습니다. 모두 눈을 감으세요.`);
            
            if (players[myId].role === ROLES.CITIZEN) {
                setTimeout(() => {
                    speakText("밤이 길어지고 있습니다. 마피아가 은밀하게 활동 중입니다.");
                    setTimeout(processAIInNight, 7000);
                }, 4000);
            }
            updateUI();
        };

        const sendMessage = () => {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || phase !== PHASES.DISCUSSION) return;

            const me = players[myId];
            speakText(msg, true, me.name, myId);
            
            chatInputBuffer = ""; 
            input.value = "";

            setTimeout(() => {
                const mentionedAI = players.find(p => p.isAlive && players.indexOf(p) !== myId && msg.includes(p.name));
                
                if (mentionedAI) triggerContextualResponse("ACCUSATION", mentionedAI);
                else triggerContextualResponse("GENERAL");
            }, 3000);
        };

        const triggerContextualResponse = (type, target = null) => {
            const aliveAIs = players.filter((p, i) => p.isAlive && i !== myId);
            if (aliveAIs.length === 0) return;
            
            let speaker, text;
            
            if (type === "ACCUSATION") {
                speaker = target;
                const defenses = [
                    `아니, ${players[myId].name}님! 제가 왜요? 전 결백합니다!`,
                    `흠, 저를 의심하시는 건가요? 제가 마피아라면 이렇게 당당하겠습니까?`,
                    `증거도 없이 사람을 몰아가면 안 됩니다. 저는 정말 시민이라구요.`
                ];
                text = defenses[Math.floor(Math.random() * defenses.length)];
            } else {
                speaker = aliveAIs[Math.floor(Math.random() * aliveAIs.length)];
                const others = aliveAIs.filter(p => p !== speaker);
                const suspect = others[0] || players[myId];
                const generalTexts = [
                    `${players[myId].name}님 말대로 지금 마을 분위기가 흉흉하네요.`,
                    `저는 아까부터 조용히 눈치만 보는 ${suspect.name}님이 유독 마피아 같아 보입니다.`,
                    `우리 더 솔직하게 대화해 봅시다. 범인은 분명 실수할 겁니다.`
                ];
                text = generalTexts[Math.floor(Math.random() * generalTexts.length)];
            }

            speakText(text, true, speaker.name, players.indexOf(speaker));
        };

        const handleAction = (targetIdx) => {
            players[myId].target = targetIdx;
            speakText(`${players[targetIdx].name}님을 지목했습니다. 결과를 기다리십시오.`);
            processAIInNight();
        };

        const processAIInNight = () => {
            players.forEach((p, i) => {
                if (i !== myId && p.isAlive) {
                    const alives = players.filter(pl => pl.isAlive);
                    if (p.role === ROLES.MAFIA) {
                        const targets = players.filter((pl) => pl.isAlive && pl.role !== ROLES.MAFIA);
                        p.target = players.indexOf(targets[Math.floor(Math.random() * targets.length)]);
                    } else if (p.role === ROLES.DOCTOR) {
                        p.target = players.indexOf(alives[Math.floor(Math.random() * alives.length)]);
                    } else if (p.role === ROLES.POLICE) {
                        const others = players.filter((pl, idx) => pl.isAlive && idx !== i);
                        p.target = players.indexOf(others[Math.floor(Math.random() * others.length)]);
                    }
                }
            });
            setTimeout(processMorning, 3000);
        };

        const processMorning = () => {
            phase = PHASES.MORNING;
            updateUI();

            const mafiaTargetIdx = players.find(p => p.role === ROLES.MAFIA && p.isAlive)?.target;
            const doctorTargetIdx = players.find(p => p.role === ROLES.DOCTOR && p.isAlive)?.target;
            
            speakText("긴 밤이 지나고 아침이 밝았습니다. 생존자들은 눈을 뜨세요.");
            
            setTimeout(() => {
                let resultMsg = "";
                let callback = null;

                if (mafiaTargetIdx !== undefined && mafiaTargetIdx !== doctorTargetIdx) {
                    const victim = players[mafiaTargetIdx];
                    resultMsg = `충격적인 소식입니다. 지난밤 마피아의 공격으로 ${victim.name}님이 싸늘한 시신으로 발견되었습니다.`;
                    callback = () => { victim.isAlive = false; updateUI(); };
                } else if (mafiaTargetIdx !== undefined && mafiaTargetIdx === doctorTargetIdx) {
                    resultMsg = "기적 같은 아침입니다! 마피아가 활동했으나 다행히 유능한 의사가 희생자를 지켜냈습니다!";
                } else {
                    resultMsg = "지난밤 아무런 소동도 없었습니다. 다행히 모두가 무사한 평화로운 밤이었습니다.";
                }

                speakText(resultMsg, false, "", undefined, callback);

                setTimeout(() => {
                    if (checkGameOver()) return;
                    phase = PHASES.DISCUSSION;
                    speakText("이제 진범을 가리기 위한 자유 토론 시간입니다. 의심스러운 자를 지목하십시오.");
                    updateUI();
                }, 8000);
            }, 6000);
        };

        const goToVoting = () => {
            phase = PHASES.VOTING;
            speakText("토론을 마치고 최후의 투표를 시작합니다. 마피아라고 확신하는 한 명을 지목하세요.");
            updateUI();
        };

        const handleVote = (targetIdx) => {
            if (players[myId].vote !== null) return;
            players[myId].vote = targetIdx;
            
            players.forEach((p, i) => {
                if (i !== myId && p.isAlive) {
                    const pool = players.filter(pl => pl.isAlive && players.indexOf(pl) !== i); 
                    p.vote = players.indexOf(pool[Math.floor(Math.random() * pool.length)]);
                }
            });
            updateUI();

            setTimeout(() => {
                const counts = {};
                players.forEach(p => { if (p.isAlive && p.vote !== null) counts[p.vote] = (counts[p.vote] || 0) + 1; });
                
                let max = 0, top = null;
                Object.keys(counts).forEach(id => { if (counts[id] > max) { max = counts[id]; top = parseInt(id); } });

                nomineeId = top;
                phase = PHASES.TRIAL;
                speakText(`투표 결과, ${players[nomineeId].name}님이 마피아 용의자로 최종 지목되었습니다. 재판을 시작하겠습니다.`);
                updateUI();
            }, 3000);
        };

        const handleJudgement = (isGuilty) => {
            const nominee = players[nomineeId];
            let msg = isGuilty ? `${nominee.name}님이 마을 사람들의 결정으로 처형되었습니다. 정체는 [${nominee.role}]이었습니다.` : `${nominee.name}님이 혐의를 벗고 방면되었습니다. 다시 밤이 찾아오고 있습니다.`;
            
            const callback = isGuilty ? () => { nominee.isAlive = false; updateUI(); } : null;
            
            speakText(msg, false, "", undefined, callback);

            setTimeout(() => {
                if (checkGameOver()) return;
                players.forEach(p => { p.vote = null; p.target = null; });
                phase = PHASES.NIGHT;
                if (players[myId].role === ROLES.CITIZEN || !players[myId].isAlive) setTimeout(processAIInNight, 6000);
                updateUI();
            }, 8000);
        };

        const checkGameOver = () => {
            const mafias = players.filter(p => p.isAlive && p.role === ROLES.MAFIA).length;
            const citizens = players.filter(p => p.isAlive && p.role !== ROLES.MAFIA).length;
            if (mafias === 0) {
                phase = PHASES.GAME_OVER;
                speakText("축하합니다! 위대한 시민들의 승리입니다. 모든 마피아가 검거되었습니다.");
                updateUI(); return true;
            } else if (mafias >= citizens) {
                phase = PHASES.GAME_OVER;
                speakText("비극이네요. 마을이 마피아들의 손에 완전히 장악되었습니다.");
                updateUI(); return true;
            }
            return false;
        };

        window.onload = () => { updateUI(); };
    </script>
